<!--
  South Common Wayfinder — popup launcher (Squarespace Code Block).

  How to install:
    1. In Squarespace, edit the page where you want the wayfinder.
    2. Add a Code Block (NOT Embed, NOT Markdown).
    3. Paste this entire snippet into the block. Save.
    4. (Optional) Pin to a release tag instead of @main in the
       HOST URL — see hosting notes.

  Hosting:
    The default HOST below points at jsDelivr, which serves files
    from the public GitHub repo with CORS headers + correct MIME
    types. Squarespace's own /s/ uploader DOES NOT serve ES-module
    bundles correctly (no CORS, wrong MIME — verified 2026-05-26).

    Pattern: https://cdn.jsdelivr.net/gh/<user>/<repo>@<branch-or-tag>

    For production stability, swap @main for a release tag (e.g.
    @v1.2.0) so visitors don't pick up half-built commits. jsDelivr
    caches each URL for ~12h.

  What you get:
    A pill button labeled "Find route". Clicking opens a modal that
    lazy-loads the bundle and mounts the wayfinder inside. Click
    outside the panel, press the ✕, or press Esc to close.

  Why this is safe on Squarespace:
    - Every custom selector is scoped under .scc-wf-popup so it
      can't bleed into the Squarespace template's CSS.
    - The bundle itself is scoped under .scc-wf (CLAUDE.md
      non-negotiable).
    - No iframe.
    - Only window.SCC_WAYFINDER_CONFIG touches global scope.
    - The bundle (~89 KB) loads only when the user opens the popup;
      page weight is unaffected for visitors who don't engage.
-->

<style>
  /* All custom rules sit under .scc-wf-popup so they can't collide
     with Squarespace template selectors. The wayfinder bundle's own
     styles live under .scc-wf — disjoint by design. */
  .scc-wf-popup__launch {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border: none; border-radius: 999px;
    background: hsla(var(--accent-hsl, 17, 100%, 57%), 1);
    color: hsla(var(--white-hsl, 60, 9%, 98%), 1);
    font: 700 13px/1 'Clarkson', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    letter-spacing: 0.08em; text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
  }
  .scc-wf-popup__launch:hover { filter: brightness(0.95); }
  .scc-wf-popup__overlay {
    position: fixed; inset: 0;
    background: rgba(20, 18, 14, 0.62);
    z-index: 9500;
    display: none;
    align-items: stretch; justify-content: center;
  }
  .scc-wf-popup__overlay.is-open { display: flex; }
  .scc-wf-popup__panel {
    margin: 4vmin auto;
    width: min(94vw, 1400px); height: 92vh;
    background: hsla(var(--white-hsl, 60, 9%, 98%), 1);
    border-radius: 14px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  .scc-wf-popup__head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px;
    border-bottom: 1px solid hsla(var(--lightAccent-hsl, 32, 90%, 80%), 0.5);
    font: 700 14px/1 'Clarkson', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: hsla(var(--black-hsl, 0, 0%, 5%), 1);
  }
  .scc-wf-popup__close {
    border: none; background: transparent;
    color: hsla(var(--black-hsl, 0, 0%, 5%), 1);
    font: 700 18px/1 'Clarkson', sans-serif;
    cursor: pointer; padding: 4px 8px;
  }
  .scc-wf-popup__close:hover { color: hsla(var(--accent-hsl, 17, 100%, 57%), 1); }
  .scc-wf-popup__body { flex: 1; min-height: 0; position: relative; }
  .scc-wf-popup__body #scc-wayfinder { position: absolute; inset: 0; }
  /* Loading + error states inside the mount node. Preact's render
     replaces the children when the bundle mounts, so we don't need
     to remove these manually. */
  .scc-wf-popup__loading,
  .scc-wf-popup__error {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    font: 600 14px/1.4 'Clarkson','Helvetica Neue',Helvetica,Arial,sans-serif;
    color: hsla(var(--black-hsl, 0, 0%, 5%), 0.7);
  }
  .scc-wf-popup__error { color: hsla(var(--accent-hsl, 17, 100%, 57%), 1); }
  .scc-wf-popup__error code {
    display: block; margin-top: 8px; font-size: 12px; opacity: 0.7;
    word-break: break-all;
  }
</style>

<button class="scc-wf-popup__launch" id="scc-wf-popup-launch" type="button">Find route</button>

<div class="scc-wf-popup__overlay" id="scc-wf-popup-overlay" aria-hidden="true">
  <div class="scc-wf-popup__panel" role="dialog" aria-modal="true" aria-label="South Common Wayfinder">
    <div class="scc-wf-popup__head">
      <span>South Common Wayfinder</span>
      <button class="scc-wf-popup__close" id="scc-wf-popup-close" type="button" aria-label="Close">✕</button>
    </div>
    <div class="scc-wf-popup__body">
      <div id="scc-wayfinder">
        <div class="scc-wf-popup__loading" id="scc-wf-popup-loading">
          <span>Loading wayfinder&hellip;</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    // === EDIT THIS ===========================================
    // jsDelivr serves the dist/ folder of the public repo with
    // CORS + correct MIME types. Swap @main for a release tag for
    // production stability.
    var HOST = 'https://cdn.jsdelivr.net/gh/klue33/scommon_repo2@ff2dee0/dist';
    // BUMP THIS on every deploy. Browsers cache module scripts
    // aggressively and don't always invalidate on Ctrl+Shift+R;
    // a fresh ?v=… makes the URL look new to the cache.
    var VERSION = '20260526i';
    // =========================================================

    // Optional pre-fill for the bundle. URL params (?to, ?from,
    // ?category) override these — see EMBED.md.
    //
    // Self-hosting override: paste an absolute URL into geojsonUrl
    // below to pin site.geojson to your own server (e.g. Squarespace's
    // /s/ uploader, which serves plain JSON correctly even though it
    // can't serve ES modules).
    window.SCC_WAYFINDER_CONFIG = window.SCC_WAYFINDER_CONFIG || {};
    // window.SCC_WAYFINDER_CONFIG.geojsonUrl = 'https://southcommoncentre.ca/s/site.geojson';
    // Tune until the parking-lot backdrop hugs the polygons:
    // window.SCC_WAYFINDER_CONFIG.backdropScale   = 1.0;
    // window.SCC_WAYFINDER_CONFIG.backdropOffsetX = 0;
    // window.SCC_WAYFINDER_CONFIG.backdropOffsetY = 0;

    var overlay = document.getElementById('scc-wf-popup-overlay');
    var launch  = document.getElementById('scc-wf-popup-launch');
    var close   = document.getElementById('scc-wf-popup-close');
    var bundleLoaded = false;

    function openPopup() {
      overlay.classList.add('is-open');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      if (!bundleLoaded) {
        bundleLoaded = true;
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = HOST + '/wayfinder.css' + '?v=' + VERSION;
        document.head.appendChild(css);
        var js = document.createElement('script');
        js.src = HOST + '/wayfinder.js' + '?v=' + VERSION;
        js.type = 'module';
        // Surface a clear failure instead of a silent blank modal
        // when HOST isn't replaced, the upload's 404, the file
        // isn't HTTPS, CORS is missing, etc.
        js.onerror = function () {
          var mount = document.getElementById('scc-wayfinder');
          if (!mount) return;
          mount.innerHTML =
            '<div class="scc-wf-popup__error">' +
              "Couldn't load the wayfinder bundle." +
              '<code>' + HOST + '/wayfinder.js</code>' +
            '</div>';
        };
        document.body.appendChild(js);
      }
    }
    function closePopup() {
      overlay.classList.remove('is-open');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    launch.addEventListener('click', openPopup);
    close.addEventListener('click', closePopup);
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closePopup();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && overlay.classList.contains('is-open')) closePopup();
    });
  })();
</script>
